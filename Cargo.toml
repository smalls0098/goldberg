[package]
name = "goldberg"
description = "A Rust-based obfuscation macro library!"
repository = "https://github.com/frank2/goldberg"
version = "0.1.0"
authors = ["frank2@dc949.org"]
edition = "2021"
license = "GPL-3.0"
keywords = ["obfuscation"]
readme = "README.md"
exclude = ["*~", "#*", "src/#*", "notes.org"]
documentation = "https://docs.rs/goldberg"

[lib]
proc-macro = true

[dependencies]
moisture = { git = "https://github.com/smalls0098/moisture.git", branch = "main" }
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.9"
syn = { version = "1.0", features = ["full", "extra-traits"] }
